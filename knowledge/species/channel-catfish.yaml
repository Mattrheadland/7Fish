key: channel-catfish
name: Channel catfish
kid_friendly: true   # reasoning: eats nightcrawlers/chicken liver on a simple bottom rig, common in the Monocacy and upper Potomac, usually 11-16 in (DNR 2016 survey), manageable on light-medium gear
temp_bands_f:
  - {band: inactive, max: 45, tag: reasoning, note: "SRAC: metabolic rate halves for each 18F (10C) drop; no documented feeding cutoff found"}
  - {band: slow, min: 45, max: 60, tag: reasoning, note: "Cool-water slowdown inferred from the SRAC metabolic rule; bounds are reasoning"}
  - {band: active, min: 60, max: 75, tag: reasoning, note: "Between slow band and documented spawning range"}
  - {band: peak, min: 75, max: 85, tag: documented, src: "https://www.srac.msstate.edu/pdfs/Fact Sheets/180 Channel Catfish- Life History and Biology.pdf", note: "SRAC Pub 180: optimum growth at about 85F (29.4C); spawning 75-85F, ~80F optimum. Growth optimum is a proxy for feeding, not a measured bite rate; spawning fish (roughly late spring-early summer, reasoning) may bite less while guarding nests"}
  - {band: stressed, min: 85, tag: reasoning, note: "SRAC gives no lethal upper limit; above the growth optimum treated as declining (reasoning). Nontidal Maryland rivers rarely reach this (reasoning)"}
