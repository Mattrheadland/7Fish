    note: "DNR: 'found in good numbers throughout the upper Potomac', Cumberland to DC; 2016 summer survey stock-size rate 109/hr (10-yr high), avg 14.3 in, largest just under 25 in (src https://dnr.maryland.gov/fisheries/Documents/2016_Catfish_Summary.pdf). Population 'fairly stable', 40-60 per electrofishing hour (DNR hotspot page). Flathead also present Dam 5 to DC. Lifejacket required on the water Nov 15-May 15 (wading/boat; see regs). Month ratings are reasoning."
