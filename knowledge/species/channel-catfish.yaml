    note: "Channel and white catfish 'found in every tidal river', holding in deeper channels of upper tidal sections in winter (OTW 2025-01-30). Blues dominate Potomac catches; channel cats are incidental. Fletcher's (DC) lists channel catfish. Ratings are reasoning."
