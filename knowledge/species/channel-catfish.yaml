prefs:
  flow:   {rising: plus, falling: neutral, high_muddy: minus, low_clear: neutral, tag: reasoning, note: "SRAC: do well in muddy water but prefer clear; DNR Monocacy page warns turbidity gets very high during runoff. A first rise is a common catfish trigger (reasoning, not sourced); flood-stage water is a safety minus"}
  light:  {dawn: plus, day: minus, dusk: plus, night: plus, overcast: plus, tag: documented, src: "https://www.srac.msstate.edu/pdfs/Fact Sheets/180 Channel Catfish- Life History and Biology.pdf", note: "SRAC: most movement and feeding occurs at night, around sunset and sunrise; by day they shelter in deep holes near logs or rocks. Overcast = plus is reasoning"}
  tide:   {incoming: plus, outgoing: plus, slack: neutral, tag: reasoning, note: "Applies to tidal regions only; not documented"}
  front:  {pre_front_falling: unknown, post_front_high_rising: unknown, steady: neutral, tag: reasoning, note: "Not found"}
methods:
  - id: bottom-slide-bait
    when: "Rivers: dusk into dark, deep holes, outside bends, and below riffles/sand bars; water above ~60F"
    rig_line: "3/0-4/0 circle, 14-18 in 20-30 lb mono leader, #4 barrel swivel, bead, 1/2-1 oz egg or no-roll sinker slide, chicken liver or cut bait"
    rig:
      hook: "3/0-4/0 circle (or #2-1/0 J for kids who can't wait for a circle to set; reasoning)"
      weight: "1/2-1 oz egg or no-roll on a slide in the Monocacy/upper Potomac pools; 1-2 oz walking/no-roll in stronger current. Surf pyramids are wrong here (reasoning)"
      leader: "20-30 lb mono, 14-18 in"
      hardware: "Sinker slider or bare slide, 6 mm bead, #4-#1 barrel swivel"
      bait_or_lure: "Chicken liver (wrap with thread or use bait mesh), nightcrawler gob, cut sunfish/shad, shrimp; scented baits"
    switch_to: drift-float-bait
    switch_trigger: "Snagging rocks every cast, or bait taps but no hookups in 30 min on a riffle-fed run"
    gear_note: "Fits Matt's 7 ft Crossfire (with 4/0-5/0 circles) or 6'6\" Ugly Stiks (unconfirmed). Rhino 65 lb braid setup is overkill except where flatheads also run"
    tag: reasoning
  - id: drift-float-bait
    when: "Rocky upper-Potomac or Monocacy runs where a bottom rig snags; day or dusk"
    rig_line: "Slip float set to depth, 3/8 oz egg sinker above swivel, 18 in 20 lb mono, #1-2/0 circle, nightcrawler or cut bait drifted along seams"
    rig:
      hook: "#1-2/0 circle"
      weight: "1/4-3/8 oz egg sinker pegged above a swivel"
      leader: "20 lb mono, 18 in"
      hardware: "Slip float, bobber stop, bead, barrel swivel"
      bait_or_lure: "Nightcrawler, chicken liver, or cut sunfish"
    switch_to: bottom-slide-bait
    switch_trigger: "Float drifts too fast or fish are clearly in a deep, slow hole"
    gear_note: "Light-medium spinning; kid-friendly visual bite indicator"
    tag: reasoning
advisory:
  url: "https://mde.maryland.gov/programs/marylander/fishandshellfish/Pages/fishconsumptionadvisory.aspx"
  note: "DNR blue catfish page notes MDE advises no more than 2 meals of channel catfish per month for the Choptank; Monocacy/Potomac limits are in MDE county charts and map. Check before keeping"
  tag: documented
notes:
  - "Introduced, naturalized throughout the Potomac watershed (DNR hotspot page). [documented]"
  - "Habitat: prefer sand, gravel or rubble over mud; young feed in shallow riffles, adults in deeper water just downstream of sand bars; tolerate brackish water (SRAC 180). [documented]"
  - "Methods are reasoning-based standard catfish rigs; no MD-specific channel catfish rig guidance was found, though DNR blue-catfish rig advice (circle hooks on a slide, pyramid in current) applies. [reasoning]"
  - "Monocacy channel catfish presence is documented; quality-size catch evidence specific to the Monocacy was not found. Flathead reported by anglers but not collected in DNR Monocacy surveys. [documented/not found]"
