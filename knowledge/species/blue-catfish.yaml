    8: fair
    9: fair
    10: fair
    11: fair
    12: fair
    tag: reasoning
    note: "Choptank (Dover Bridge to Denton) and Tuckahoe Creek reported repeatedly (DNR 2026-03-18, 2026-08-19, OTW 2025-09-11). Matapeake pier: blue and channel cats 'may also be in the mix' when salinity is low (FishTalk). Kent Narrows Bridge catch pictured (DNR 2024-04-08). Main-Bay shore spots are salinity-dependent; ratings are reasoning."
prefs:
  flow:   {rising: unknown, falling: unknown, high_muddy: unknown, low_clear: unknown, tag: reasoning, note: "Low salinity pushes big fish down tidal rivers (DNR 2024-04-17); decreased Conowingo flow improved fishing (DNR 2025-09-24). Not enough to rate a general flow direction"}
  light:  {dawn: plus, day: neutral, dusk: plus, night: plus, overcast: neutral, tag: reasoning, note: "No blue-specific light preference found; catfish feeding peaks around sunset/sunrise per SRAC for channel catfish. Potomac charter/boat reports show day bites in deep holes"}
  tide:   {incoming: plus, outgoing: plus, slack: neutral, tag: reasoning, note: "Moving water carries scent; not documented for blues in sources opened"}
  front:  {pre_front_falling: unknown, post_front_high_rising: unknown, steady: neutral, tag: reasoning, note: "Not found"}
methods:
  - id: cut-bait-slide
    when: "Year-round from tidal-river banks with deep channel or outside bend within casting range; best on moving water"
    rig_line: "7/0-8/0 circle, 18-24 in 50 lb mono leader, #3/0 barrel swivel, 8 mm bead, 3-6 oz no-roll or pyramid on fish-finder slide, fresh menhaden or gizzard shad chunk"
    rig:
      hook: "7/0-10/0 inline circle (Potomac guide uses 8/0-10/0; DNR suggests 8/0 circle for the Choptank)"
      weight: "3-6 oz no-roll or pyramid on a slide, enough to hold in tidal current from shore (Modoski uses 3-6 oz from a boat; DNR: bank or pyramid sinkers from shore)"
      leader: "50 lb mono or fluoro, 18-24 in (DNR: shorten in swift current)"
      hardware: "Fish-finder slide or sinker slider, 8 mm bead, heavy barrel swivel; optional 2 in slit cork float and rattle ahead of the hook (DNR)"
      bait_or_lure: "Fresh menhaden, gizzard shad, white perch, eel or market fish chunk; frozen bunker in cold water (Modoski)"
    switch_to: chicken-liver-light
    switch_trigger: "Only small fish or crabs stripping cut bait in 30 min, or fishing a slower tributary bank"
    gear_note: "Best on a heavy 8-10 ft catfish/surf rod with 50-65 lb braid. Matt's Rhino catfish setup with 65 lb braid (unconfirmed) or his 10 ft Penn Pursuit IV fit; the Crossfire MH is undergunned for big blues. His 4/0-5/0 circles are small for big blues - buy 7/0-8/0"
    tag: documented
    src: "https://onthewater.com/fishing-the-patomac-river-for-blue-cats"
  - id: chicken-liver-light
    when: "Smaller tidal creeks and slower banks, eating-size fish (under ~10 lb), spring and fall"
    rig_line: "5/0 circle, 18 in 30 lb mono, barrel swivel, bead, 1-2 oz egg or bank sinker slide, chicken liver or cut shad"
    rig:
      hook: "4/0-5/0 circle (DNR minimum guidance: about 1/0, avoid small hooks)"
      weight: "1-2 oz egg or bank sinker on a slide in slack water; DNR: '1 to half-ounce' sinkers usually fine, pyramid in strong current"
      leader: "30 lb mono, 18-24 in; weight about 2 ft above bait (DNR quoting Wilson)"
      hardware: "Barrel swivel, bead"
      bait_or_lure: "Chicken liver, wild shrimp, nightcrawlers, cut sunfish or white perch (DNR 2024-04-08)"
    switch_to: cut-bait-slide
    switch_trigger: "Current lifts the sinker, or only dinks after 30 min and a deep channel is in range"
    gear_note: "Fits Matt's 7 ft Crossfire or 6'6\" Ugly Stiks (unconfirmed) with his 4/0-5/0 circles. Bait must stay fresh; H Mart is Matt's cut-bait source"
    tag: documented
    src: "https://news.maryland.gov/dnr/2024/04/08/join-the-hunt-how-to-catch-a-blue-catfish-in-maryland/"
advisory:
  url: "https://mde.maryland.gov/programs/marylander/fishandshellfish/Pages/fishconsumptionadvisory.aspx"
  note: "MDE links a Blue Catfish Fact Sheet (2022). DNR blue catfish page: remove red meat and silver skin; one to two catfish meals per month generally considered safe except Baltimore County and City; fish under 10 lb tend to be edible once fat and red meat are removed. Verify the current MDE chart for the specific water before keeping"
  tag: documented
notes:
  - "Invasive. DNR: no catch limit, harvest encouraged; illegal to transport live blue catfish to another water (DNR upper Potomac page). Regs file owns the legal detail. [documented]"
  - "Adults survive salinity up to 17 psu for up to 3 days (Walsh, ICPRB 2024). [documented]"
  - "A blue was landed below Great Falls in 2021 (DNR 2024-04-08 caption). That is downstream of the upper-potomac region (Harpers Ferry-Great Falls); no evidence found of blues above Great Falls, so upper-potomac and frederick-rivers are omitted. [documented catch; omission reasoning]"
  - "Shore access to the tidal Potomac channel is limited; most Potomac reports are boat-based (Modoski fishes 'almost exclusively' from a boat). Spot files must verify a bank that reaches deep water. [reasoning]"
  - "Bait theft by blue crabs in saltier water; fish farther up tidal rivers to avoid them (DNR 2024-07-24). [documented]"
