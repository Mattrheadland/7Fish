key: blue-catfish
name: Blue catfish
kid_friendly: false   # reasoning: abundant and bait-eating, but the tidal Potomac/Bay-river banks that hold them need 3-6 oz sinkers in current, heavy rods, and fish routinely 15-20 lb+ (DNR 2024-04-17). An adult can hand a hooked small blue to a child; not a simple kid-run target
temp_bands_f:
  - {band: inactive, max: 40, tag: reasoning, note: "No documented feeding cutoff found. DNR describes blues as good winter targets in deep channels (OTW 2024-12-19; DNR winter preview 2023-12-20), so the inactive band is set low"}
  - {band: slow, min: 40, max: 50, tag: reasoning, note: "Winter: fish 'seek out deeper waters in the channels of the tidal rivers' middle to upper sections' (DNR 2023-12-20) - harder to reach from shore"}
  - {band: active, min: 50, max: 70, tag: reasoning, note: "DNR 2024-03-27: tidal Potomac water 'mid-50s' and blues 'becoming more active along channel edges'. DNR 2026-10-07: cooling water making them more active. Range bounds are reasoning"}
  - {band: peak, min: 70, max: 84, tag: documented, src: "https://potomacriver.org/wp-content/uploads/2024/10/Walsh_ICPRB-2024_Walsh.pdf", note: "Walsh (ICPRB 2024): spawning when 'Water temps reach 70-84F', ~80F ideal; adults 'feed heavily prior to and after spawning'. Pre/post-spawn feeding window, not a measured bite optimum; spawning fish themselves move to shallow small tributaries"}
  - {band: stressed, min: 84, tag: reasoning, note: "No documented upper stress figure found; summer fish move downriver (DNR bcat page) and low-oxygen zones in the Potomac (Indian Head to Colonial Beach, DNR 2026-08-19) are reasoning-based negatives"}
season:
  tidal-potomac:
    1: good
