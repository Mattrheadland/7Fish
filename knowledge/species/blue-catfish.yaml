    10: good
    11: good
    12: good
    tag: reasoning
    note: "Large concentrations Wilson Bridge south to the Route 301 Bridge; 'Fishing from shore... with large circle hooks and cut bait is the ticket' (DNR 2023-03-29). Below Wilson Bridge good in winter (DNR blue catfish page). Pre-spawn aggressive feeding in May (DNR 2026-05-06). Large populations down to the Wilson Bridge, more active as water cools (DNR 2026-10-07). Fletcher's Cove (DC water, separate license) lists blues in spring (PropTalk 2025-03-10). Month ratings are reasoning."
  upper-bay:
    1: fair
    2: fair
    3: good
    4: good
    5: good
    6: good
    7: good
    8: good
    9: good
    10: good
    11: good
    12: fair
    tag: reasoning
    note: "Lower Susquehanna (Conowingo pool to mouth, Havre de Grace) and Chester River (Crumpton) repeatedly reported good year-round; 'very good' in upper Bay tidal rivers 2026-10-07; 'in numbers... north of the Patapsco' May 2026. DNR believes 2018-19 wet years spread them through the upper Bay. Month ratings are reasoning."
  middle-bay:
    1: fair
    2: fair
    3: good
    4: good
    5: fair
