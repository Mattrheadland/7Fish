      regions: [upper-bay, middle-bay, tidal-potomac]
      harvest: [{start: "01-01", end: "12-31", size: "not found", creel: "not found", note: "COMAR 08.02.05.04 sets an 8 in minimum, but only for white perch caught other than by hook and line. A recreational hook-and-line size or creel limit was not found."}]
      targeting_closed: []
      src: "https://regs.maryland.gov/us/md/exec/comar/08.02.05.04"
      tag: reasoning
      warning: "Tidal recreational white perch limits not found in an opened official source. Year-round season is reasoning (fishandhuntmaryland.com says open year-round). Confirm before harvest."
  bluefish:
    - area: "All Maryland waters (Bay, tidal, Atlantic, coastal bays)"
      regions: [upper-bay, middle-bay, tidal-potomac, md-coast]
      harvest: [{start: "01-01", end: "12-31", size: "8 in minimum", creel: "5 per person per day (shore or private boat); 7 on for-hire boats", note: "Public notice effective 12:01 a.m. January 1, 2026. No closed season."}]
      targeting_closed: []
      src: "https://dnr.maryland.gov/fisheries/Documents/Public_Notices/PubNotBluefishRec_Effective1-1-2026.pdf"
      tag: documented
      warning: "Tidal Potomac mainstem is PRFC water; PRFC bluefish rules not found."
  blue-catfish:
    - area: "Maryland tidal waters"
      regions: [upper-bay, middle-bay, tidal-potomac]
      harvest: [{start: "01-01", end: "12-31", size: "none", creel: "none", note: "DNR 2026-07-29 report: 'there are no size limits or creel limits associated with blue catfish.' DNR 2024-04-08: 'no offseason and no creel limit for blue catfish.'"}]
      targeting_closed: []
      transport: "Illegal to transport live blue catfish into another body of water (fine up to $2,500). DNR asks anglers to remove and kill blue catfish they catch; catch and release discouraged."
      src: "https://news.maryland.gov/dnr/2026/07/29/maryland-fishing-report-july-29-2/"
      src_also: ["https://news.maryland.gov/dnr/?p=41277", "https://dnr.maryland.gov/fisheries/Pages/invasive-fish.aspx"]
      tag: documented
      warning: "Applies to MD waters. On the tidal Potomac mainstem PRFC rules were not checked."
    - area: "Nontidal waters (MD)"
      regions: [frederick-rivers, upper-potomac]
      harvest: [{start: "01-01", end: "12-31", size: "not found", creel: "not found", note: "COMAR 08.02.11.04 lists only channel catfish creel; blue catfish not addressed."}]
      targeting_closed: []
      transport: "Live transport to another water is illegal (DNR invasive fishes page)."
      src: "https://regs.maryland.gov/us/md/exec/comar/08.02.11.04"
      tag: reasoning
      warning: "Nontidal blue catfish limit not found; likely none, but unconfirmed."
  channel-catfish:
