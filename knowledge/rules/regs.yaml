checked_on: 2026-10-14
notes:
  - "These pages could not be opened this session (permission timeouts): dnr.maryland.gov/fisheries regulations pages (striped-bass.aspx, sportfish.aspx), the eRegulations Maryland guide, the PRFC site, and the NOAA CO-OPS station home pages. The rules below come from the DNR 2026 striped bass maps page, DNR news releases, DNR public notices, and COMAR text on regs.maryland.gov."
  - "COMAR pages on regs.maryland.gov did not display an effective date. Where a COMAR section conflicts with a 2026 DNR release, the release is treated as current and the conflict is flagged."
  - "Tidal Potomac mainstem is under the Potomac River Fisheries Commission (PRFC), not MD DNR. No PRFC page was opened, so every tidal-Potomac-mainstem entry below carries a warning."
species:
  striped-bass:
    - area: "Chesapeake Bay and tidal tributaries (MD), excluding Susquehanna Flats, Lower Susquehanna River and Northeast River"
      regions: [upper-bay, middle-bay]
      harvest:
        - {start: "05-01", end: "05-15", size: "19-24 in", creel: "1 per person per day", note: "Only in listed areas: Bay from Brewerton Channel to the VA line, with exclusions. Spawning rivers and areas off limits. No stinger hooks; barbless hooks and max 6 lines when trolling."}
        - {start: "05-16", end: "05-31", size: "19-24 in", creel: "1 per person per day", note: "Only downstream of the Hart-Miller Island Dike/Tolchester line to the MD/VA line, with exceptions. Spawning areas off limits."}
        - {start: "06-01", end: "07-31", size: "19-24 in", creel: "1 per person per day", note: "All areas. Circle-hook rules apply."}
        - {start: "09-01", end: "12-05", size: "19-24 in", creel: "1 per person per day", note: "All areas. Circle-hook rules apply."}
      catch_and_release_only:
        - {start: "01-01", end: "02-28", note: "All areas. No eels as bait."}
        - {start: "03-01", end: "04-30", note: "Only Bay mainstem downstream of the Abbey Point-Worton Point line to the VA line (incl. Tangier and Pocomoke Sounds). Spawning rivers and areas closed."}
        - {start: "12-06", end: "12-31", note: "All areas. No eels as bait."}
      targeting_closed:
        - {start: "08-01", end: "08-31", note: "'All areas closed to striped bass fishing ... Attempting to catch striped bass is illegal.' COMAR 08.02.15.12I(5): may not target (catch, attempt to catch, harm, harass or pursue) striped bass in the Bay or its tidal tributaries. Catch-and-release is not allowed either."}
        - {start: "03-01", end: "05-31", note: "Spawning rivers and areas only: Choptank, Chester, Manokin, Nanticoke, Patuxent, Transquaking, Wicomico rivers, plus the Upper Bay spawning area incl. Susquehanna Flats (COMAR 08.02.15.12I(2); DNR 2026-03-31 release). Exact boundaries are on the DNR maps."}
      gear: "Circle-hook rules apply year-round per DNR. No stinger (trailing) hooks Mar-Apr. Barbless hooks and max 6 lines when trolling Mar-Apr. No eels as bait during catch-and-release periods."
      src: "https://dnr.maryland.gov/fisheries/Pages/sb_reg_maps.aspx"
      src_also: ["https://news.maryland.gov/dnr/2026/03/12/maryland-set-to-adopt-changes-to-chesapeake-bay-recreational-striped-bass-season/", "https://news.maryland.gov/dnr/?p=47043", "https://regs.maryland.gov/us/md/exec/comar/08.02.15.12", "https://regs.maryland.gov/us/md/exec/comar/08.02.15.09"]
      tag: documented
    - area: "Susquehanna Flats, Lower Susquehanna River, Northeast River (MD)"
      regions: [upper-bay]
      harvest:
        - {start: "06-01", end: "07-31", size: "19-24 in", creel: "1 per person per day", note: "Circle hooks"}
        - {start: "09-01", end: "12-05", size: "19-24 in", creel: "1 per person per day", note: "Circle hooks"}
      catch_and_release_only:
        - {start: "01-01", end: "03-31", note: "No eels as bait Jan-Feb. March: no stinger hooks; barbless hooks and max 6 lines when trolling."}
        - {start: "12-06", end: "12-31", note: "No eels as bait"}
      targeting_closed:
        - {start: "04-01", end: "05-31", note: "Closed to striped bass fishing upstream of the Abbey Point-Worton Point line"}
        - {start: "08-01", end: "08-31", note: "Closed, no targeting"}
      src: "https://dnr.maryland.gov/fisheries/Pages/sb_reg_maps.aspx"
      tag: documented
    - area: "Maryland tributaries of the tidal Potomac (e.g., Mattawoman) — MD DNR waters"
      regions: [tidal-potomac]
      harvest:
        - {start: "05-01", end: "07-31", size: "19-24 in", creel: "1 per person per day", note: "DNR maps page says Potomac tributaries downstream of the Nice Memorial Bridge (US 301) are excluded from the general May closures and listed as open. Tributaries upstream of US 301 are assumed to follow the general Bay table (Jun 1 opening); not verified."}
        - {start: "09-01", end: "12-05", size: "19-24 in", creel: "1 per person per day", note: ""}
      targeting_closed:
        - {start: "08-01", end: "08-31", note: "Bay and tidal tributaries closed to targeting"}
      src: "https://dnr.maryland.gov/fisheries/Pages/sb_reg_maps.aspx"
      tag: reasoning
      warning: "May 1 harvest start for tributaries upstream of US 301 is not verified. Read the DNR maps for the exact tributary boundaries."
    - area: "Potomac River tidal mainstem (PRFC jurisdiction)"
      regions: [tidal-potomac]
      harvest: []
      targeting_closed: []
      src: "https://dnr.maryland.gov/fisheries/Pages/sb_reg_maps.aspx"
      tag: reasoning
      warning: "PRFC rules not found. The PRFC site (prfc.us / potomacriver.org) was not opened. DNR says Potomac mainstem rules come from PRFC. Treat as unknown; do not recommend harvest on the mainstem until PRFC 2026 rules are confirmed. An empty harvest list here means unknown, not catch-and-release."
    - area: "Atlantic Ocean, coastal bays and tributaries (MD), incl. Ocean City Inlet"
      regions: [md-coast]
      harvest:
        - {start: "01-01", end: "12-31", size: "28-31 in slot", creel: "1 per person per day", note: "DNR 2026 releases: 'The ocean recreational fishery is open year-round with a 28-31 inch slot limit and a coastwide daily bag limit of one fish.'"}
      targeting_closed: []
      src: "https://news.maryland.gov/dnr/2026/03/12/maryland-set-to-adopt-changes-to-chesapeake-bay-recreational-striped-bass-season/"
      src_also: ["https://news.maryland.gov/dnr/?p=47043", "https://regs.maryland.gov/us/md/exec/comar/08.02.15.11"]
      tag: documented
      warning: "COMAR 08.02.15.11 as displayed on regs.maryland.gov shows an older rule (28-38 in or 44+ in, 2 per day). That conflicts with the DNR 2026 release, which is used here. Confirm on the DNR striped bass page before keeping a fish."
    - area: "Nontidal waters (MD) — streams and rivers incl. Monocacy and upper Potomac"
      regions: [frederick-rivers, upper-potomac]
      harvest: []
      targeting_closed: []
      note: "COMAR 08.02.11.04: striped bass in nontidal streams and rivers: Closed, none permitted. Nontidal lakes and ponds: open year-round, 2 per day (only 1 over 30 in), 18 in minimum. Whether 'closed' bars catch-and-release targeting is not stated."
      src: "https://regs.maryland.gov/us/md/exec/comar/08.02.11.04"
      tag: documented
  white-perch:
    - area: "Nontidal waters (MD)"
      regions: [frederick-rivers, upper-potomac]
      harvest: [{start: "01-01", end: "12-31", size: "no minimum", creel: "no daily limit", note: "COMAR 08.02.11.04"}]
      targeting_closed: []
