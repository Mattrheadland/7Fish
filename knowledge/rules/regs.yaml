      regions: [frederick-rivers, upper-potomac]
      harvest: [{start: "01-01", end: "12-31", size: "no minimum", creel: "5 per day / 10 possession", note: "COMAR 08.02.11.04"}]
      targeting_closed: []
      src: "https://regs.maryland.gov/us/md/exec/comar/08.02.11.04"
      tag: documented
    - area: "Maryland tidal waters"
      regions: [upper-bay, middle-bay, tidal-potomac]
      harvest: [{start: "01-01", end: "12-31", size: "not found", creel: "not found", note: ""}]
      targeting_closed: []
      src: "not found"
      tag: reasoning
      warning: "Tidal channel catfish limits not found in an opened official source."
  flathead-catfish:
    - area: "All Maryland waters"
      regions: [upper-bay, middle-bay, tidal-potomac, frederick-rivers, upper-potomac]
      harvest: [{start: "01-01", end: "12-31", size: "not found", creel: "not found", note: "Not addressed in COMAR 08.02.11.04. DNR asks anglers to remove and kill flathead catfish; catch and release discouraged."}]
      targeting_closed: []
      transport: "Illegal to transport live flathead catfish into another body of water (fine up to $2,500)."
      src: "https://dnr.maryland.gov/fisheries/Pages/invasive-fish.aspx"
      tag: reasoning
      warning: "Size and creel limits not found. The transport ban and kill request are documented on the DNR invasive fishes and catfish pages."
  northern-snakehead:
    - area: "All Maryland waters (tidal and nontidal)"
      regions: [upper-bay, middle-bay, tidal-potomac, frederick-rivers, upper-potomac]
      harvest: [{start: "01-01", end: "12-31", size: "none", creel: "none", note: "COMAR 08.02.11.04: not subject to season, creel or size limit (nontidal). DNR snakehead FAQ: 'no seasons, no size limits and no creel limits.'"}]
      targeting_closed: []
      possession: "COMAR 08.02.19.06D: 'an individual may only possess a snakehead if, immediately upon capture, the snakehead is killed.' Live possession, transport, import or introduction is prohibited (08.02.19.06A-C). DNR FAQ: fish you don't keep may be released only immediately and directly back into the water they came from. DNR asks anglers to kill all snakehead; fine up to $2,500 for live transport."
      src: "https://regs.maryland.gov/us/md/exec/comar/08.02.19.06"
      src_also: ["https://regs.maryland.gov/us/md/exec/comar/08.02.11.04", "https://stg-dnr.maryland.gov/fisheries/Documents/SHQ_A-fishing.pdf", "https://dnr.maryland.gov/fisheries/Pages/invasive-fish.aspx"]
      tag: documented
      warning: "The FAQ is dated 4/19 and was served from a DNR staging host (stg-dnr). PRFC rules for the tidal Potomac mainstem were not checked."
