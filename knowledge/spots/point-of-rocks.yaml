id: point-of-rocks
name: Point of Rocks
status: active
lat: 39.2738
lon: -77.5376
approx: true
region: upper-potomac
water_type: river
bank_faces_deg: 180
bank_faces_note: {text: "Maryland bank is the north shore; angler faces roughly south across the Potomac. Read from map geometry, not surveyed.", tag: reasoning}
luca_ok: false
luca_note: {text: "Matt reports the bank is hard to work; ramp area plus current and rock make it a poor fit for a young child.", tag: reasoning}
