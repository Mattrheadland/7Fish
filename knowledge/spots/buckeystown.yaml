species:
  smallmouth-bass:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "MD DNR: smallmouth and largemouth are the most targeted Monocacy sportfish. Catch-and-release for bass from Buckeystown Dam downstream to the Potomac.", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
      - {text: "MD DNR weekly: the Monocacy 'also holds good populations of smallmouth bass'. Historical by now.", date: "published 2026-09-02", tag: documented, src: "https://news.maryland.gov/dnr/2026/09/02/maryland-fishing-report-september-2/"}
  largemouth-bass:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "MD DNR lists largemouth among the most targeted Monocacy sportfish. River-wide.", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
  channel-catfish:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "MD DNR: channel catfish most common in the lower reaches of the Monocacy (Buckeystown is in the lower half; reasoning).", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
  flathead-catfish:
    presence: not_verified
    presence_note: "Angler reports only; not collected in DNR standardized Monocacy surveys."
    quality: not_verified
    evidence:
      - {text: "MD DNR: increased angler reports of flathead catfish and northern snakehead, not collected in standardized surveys to date.", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
  northern-snakehead:
    presence: not_verified
    presence_note: "Angler reports only."
    quality: not_verified
    evidence:
      - {text: "Same DNR statement as flathead.", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
access:
  status: not_verified
  parking: {text: "Buckeystown Community Park (Frederick County Parks, 7221 Michaels Road listed as contact address): gravel lot for up to 20 vehicles; canoe/kayak access.", tag: documented, src: "https://www.riverexplorer.com/details.php?id=1308"}
  walk: {text: "NPS: 160 ft portage to a 'somewhat steep and rocky soft launch', or 250 ft carry to a steep ramp (not for vehicles) with narrow staircases on either side.", tag: documented, src: "https://www.nps.gov/articles/000/plan-your-own-adventure-on-the-monocacy-river-water-trail.htm"}
  stand: {text: "not found. The launch points are documented; a fishable bank is not.", tag: reasoning}
  casting: {text: "not found", tag: reasoning}
  landing: {text: "not found. The steep, rocky launch suggests awkward landing (reasoning).", tag: reasoning}
  hours: {text: "'Hours of operation are 8 AM to sunset.' Third-party listing, not confirmed on a Frederick County page.", open: "08:00", close: "sunset", tag: documented, src: "https://www.riverexplorer.com/details.php?id=1308"}
  after_dark: prohibited
  after_dark_note: {text: "Park closes at sunset per riverexplorer; county FAQ says no vehicles after official closing without a permit. No evening session after sunset.", tag: documented, src: "https://recreater.com/m/faq?cat=18"}
