hazards:
  - "Steep, rocky launch and steep ramp with narrow stairs (NPS, documented)."
  - "Buckeystown Dam nearby; dams create dangerous currents (reasoning; dam location relative to the park not mapped here)."
  - "Flooding: FDKM2 upstream action 13 ft, flood 15 ft (documented)."
