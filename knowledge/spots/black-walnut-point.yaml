    has: [water_level, water_temp, air_temp, barometric_pressure, wind]
    note: "Up the Choptank, 16.4 mi. River water temp runs a little off open-Bay water at the point; the DNR 2026-10-07 report gave Middle Bay about 68°F and Choptank at Cambridge about 66°F."
    tag: documented
    src: "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/8571892/sensors.json"
