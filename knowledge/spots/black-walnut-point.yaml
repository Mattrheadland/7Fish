id: black-walnut-point
name: Black Walnut Point (south tip of Tilghman Island)
status: active
lat: 38.68
lon: -76.333
approx: true
region: middle-bay
water_type: bay
bank_faces_deg: 225
bank_faces_note: "Point juts south between the open Bay (west) and the Choptank mouth (east). The Bay-side riprap that sources point to faces roughly west to southwest. Reasoning from map position."
bank_faces_tag: reasoning
luca_ok: false
luca_note: "The only fishable shore documented is riprap (rocks). No clean, flat bank or pier was found. Hunters may be present in season. The site's 9am-5pm hours do keep a family trip in daylight. Re-rate if Matt finds a safe flat spot on site."
luca_tag: reasoning
stations:
  usgs:  {id: null}
  nwps:  {id: null}
  coops:
    id: "8571901"
    name: "Avalon, Tilghman Island, MD (NOAA lists it as 'AVALON, TILGANAN ISLAND')"
    lat: 38.71
    lon: -76.335
    distance_mi: 2.1
    has: [tide_predictions]
    note: "Subordinate prediction station referenced to Baltimore 8574680 (high tide -174 min, low tide -168 min, ratio height offsets). Predictions only, no live sensors confirmed."
    tag: documented
    src: "https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations/8571901/tidepredoffsets.json"
