    note: "Open Bay off the Little Choptank. Best open-water proxy for the point. Sometimes pulled over winter."
    tag: documented
    src: "https://buoybay.noaa.gov/locations/gooses-reef"
  ndbc: {id: null}
flow_ceiling: {value: null, unit: cfs, source: n/a}
wind_gust_limit_mph: 25
wind_note: "Exposed point with open Bay to the west and south and wet riprap underfoot. 25 mph gust limit, lower with a strong westerly onto the rocks. Reasoning."
wind_tag: reasoning
species:
  striped-bass:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "MD DNR public lands page: fishing permitted for brackish water species such as rockfish, perch, and bluefish.", date: "n/a", published: "not found", tag: documented, src: "https://dnr.maryland.gov/publiclands/Pages/eastern/Black-Walnut-Point.aspx"}
      - {text: "fishandhuntmaryland.com: 'Fish riprap on the Bay side of the point'; cast the current break directly south of the point. Lists striped bass, bluefish, speckled trout, and white perch. No dated catches.", date: "not found", published: "not found (2026 copyright footer only)", tag: documented, src: "https://fishandhuntmaryland.com/articles/black-walnut-point"}
    note: "No dated shore catch of striped bass at the point was found, so size and quality are unknown. The current break off the point is a fact from the source; that it holds fish in November is reasoning."
  white-perch:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "DNR lists perch as a permitted target; fishandhunt lists white perch.", date: "n/a", published: "not found", tag: documented, src: "https://dnr.maryland.gov/publiclands/Pages/eastern/Black-Walnut-Point.aspx"}
  bluefish:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "DNR lists bluefish as a permitted target.", date: "n/a", published: "not found", tag: documented, src: "https://dnr.maryland.gov/publiclands/Pages/eastern/Black-Walnut-Point.aspx"}
    note: "Bluefish usually leave the Middle Bay in fall, so November presence is doubtful. Reasoning."
  blue-catfish:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "DNR angler report: two blue catfish, about a foot each, 'off the rocks' bottom fishing clam at Black Walnut Point, Bayside. Catch date not stated.", date: "not found", published: "2024-05-07", tag: documented, src: "https://dnrweb.dnr.state.md.us/fisheries/fishingreport/single-1.asp?ID=8577"}
    note: "Small fish. One historical shore report."
  channel-catfish:
    presence: not_verified
    quality: not_verified
    evidence: []
    note: "not found"
  other:
    - {species: "spotted seatrout", presence: not_verified, text: "fishandhunt lists 'speckled trout'. No date, no catch.", tag: documented, src: "https://fishandhuntmaryland.com/articles/black-walnut-point"}
access:
  status: not_verified
  status_note: "Public fishing is documented. The parking-lot 'fishing area' and Bay-side riprap are public. Whether you can stand on the tip itself is not verified, because the inn's roughly 6 acres around the point are private. Check on site before committing a family trip to the tip."
  parking:
    text: "No parking on the DNR facility itself. Park in the Talbot County-maintained 'Black Walnut Point Fishing Area' lot a short distance away at 4787 Black Walnut Point Rd, Tilghman. Capacity conflicts: fishandhunt says the paved lot holds up to five cars; Delmarva Trails calls it 'large'; a Google review quoted by TourTalbot says 'plenty of parking'. Porta-potties. No entry fee."
    tag: documented
    src: "https://dnr.maryland.gov/publiclands/Pages/eastern/Black-Walnut-Point.aspx"
    src2: "https://fishandhuntmaryland.com/articles/black-walnut-point"
    src3: "https://www.delmarvatrailsandwaterways.com/beaches-piers/black-walnut-point"
  walk:
    text: "From the lot (just north of the Navy research station), walk the gravel road south. There is a 0.75 mi nature trail loop in the woods north of the point. Walking distance from the lot to the Bay-side riprap not found."
    tag: documented
    src: "https://www.delmarvatrailsandwaterways.com/hiking-nature-trails/black-walnut-point-nrma"
  stand:
    text: "Bay-side riprap ('Fish riprap on the Bay side of the point'). Delmarva Trails says the county fishing area is 'not technically a pier, but still available for recreational fishing.' No pier or bulkhead documented. Standing room on the point tip is not verified, because the private inn sits around it."
    tag: documented
    src: "https://fishandhuntmaryland.com/articles/black-walnut-point"
    src2: "https://www.delmarvatrailsandwaterways.com/beaches-piers/black-walnut-point"
  casting:
    text: "Open Bay in front of the riprap, so casting room is likely good. The current break 'directly south of the point' may be beyond shore casting range; not verified."
    tag: reasoning
  landing:
    text: "Landing on riprap: footing on wet rock. A long-handled landing net is advised for slot stripers. No drop net needed at shore level."
    tag: reasoning
  hours:
    text: "DNR NRMA open daily, 9 a.m. to 5 p.m. Hours for the county lot are not stated. Plan sessions inside 09:00 to 17:00, so the dawn bite is not available on NRMA land. November sunset is roughly 16:40 to 17:00 (approximate, not looked up), so the close falls near sunset."
    open: "09:00"
    close: "17:00"
    tag: documented
    src: "https://dnr.maryland.gov/publiclands/Pages/eastern/Black-Walnut-Point.aspx"
  after_dark: prohibited
  after_dark_note: "NRMA closes at 5 p.m. After-dark use of the county fishing-area lot itself is not verified."
  rules_on_site:
    text: "Pets allowed. Inn property is private and not open to the public. Hunters may be present (Delmarva Trails links to hunting seasons); November is inside fall hunting seasons, so wear blaze orange. Hunting-day closures not found. Contact: Tuckahoe State Park HQ 410-820-1668."
    tag: documented
    src: "https://www.delmarvatrailsandwaterways.com/hiking-nature-trails/black-walnut-point-nrma"
jurisdiction:
  water: tidal
  state: MD
  license: "Maryland Chesapeake Bay & Coastal Sport Fishing License (Matt states he holds a MD tidal license; not verified)"
  flags:
    - "Striped bass, Chesapeake Bay rules: November falls inside the Sep 1 to Dec 5 harvest season (1 fish per day, 19 to 24 in). Catch-and-release only Dec 6 to 31."
    - "The point is at the Choptank mouth, and the Choptank is a listed spawning river closed to targeting Mar 1 to May 31. Whether the point lies inside that boundary is not verified; this matters only in spring."
  tag: documented
  src: "https://dnr.maryland.gov/fisheries/Pages/sb_reg_maps.aspx"
crowding: "not found. A parking lot that one source sizes at about 5 cars would fill fast on a good weekend."
hazards:
  - "Slippery riprap footing"
  - "Exposed point; west and south wind and waves break on the rocks"
  - "Hunters may be present in season (November)"
  - "Private inn property next to the point; don't trespass"
  - "Navy research station next to the parking area; obey posted signs"
matt_notes:
  - "Matt plans a November 2026 striped bass trip here with family (from task brief)."
