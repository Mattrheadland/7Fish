species:
  smallmouth-bass:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "MD DNR: smallmouth and largemouth bass are the most targeted sportfish in the Monocacy. River-wide, not this spot.", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
      - {text: "MD DNR weekly: the Monocacy 'also holds good populations of smallmouth bass'. Historical by now.", date: "published 2026-09-02", tag: documented, src: "https://news.maryland.gov/dnr/2026/09/02/maryland-fishing-report-september-2/"}
  largemouth-bass:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "MD DNR lists largemouth among the most targeted Monocacy sportfish. River-wide.", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
  channel-catfish:
    presence: verified
    quality: not_verified
    quality_note: "Only historical (2015) size evidence; nothing current."
    evidence:
      - {text: "MD DNR: channel catfish in most sections, most common in the lower reaches.", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
      - {text: "Angler report: 15 lb catfish (species not stated) 'below Pinecliff Park'. Historical.", date: "catch 2015-04-25; published 2015-05-12", tag: documented, src: "https://dnrweb.dnr.state.md.us/fisheries/fishingreport/single-1.asp?ID=5100"}
  flathead-catfish:
    presence: not_verified
    presence_note: "Angler reports only; DNR has not collected flatheads in standardized Monocacy surveys."
    quality: not_verified
    evidence:
      - {text: "MD DNR: angler reports of flathead catfish and northern snakehead have increased, but 'the division has not collected these species from the Monocacy River in standardized surveys to date'.", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
  northern-snakehead:
    presence: not_verified
    presence_note: "Angler reports only; not in DNR surveys."
    quality: not_verified
    evidence:
      - {text: "Same DNR statement as flathead: angler reports, not survey-confirmed.", date: "undated page", tag: documented, src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"}
access:
  status: not_verified
  parking: {text: "Frederick County park, 8350 Pinecliff Park Road, Frederick MD 21704; paved concrete boat ramp. Parking size not found.", tag: documented, src: "https://www.riverexplorer.com/details.php?id=1310"}
  walk: {text: "not found", tag: reasoning}
  stand: {text: "not found. The ramp is not a fishing bank. Matt has fished here; the bank itself is not described online.", tag: reasoning}
  casting: {text: "not found", tag: reasoning}
  landing: {text: "not found", tag: reasoning}
  hours: {text: "Potomac River Guide (riverexplorer) says 'The park is open from 8am-10:30pm.' Third-party listing, undated; not confirmed on a Frederick County page. County FAQ: no vehicles after official closing time without a permit.", open: "08:00", close: "22:30", tag: documented, src: "https://www.riverexplorer.com/details.php?id=1310"}
  after_dark: not_verified
  after_dark_note: {text: "If the 10:30 pm closing is right, an evening session after sunset is possible until close, but this is not confirmed by the county. County FAQ says fishing on the Monocacy follows DNR rules.", tag: reasoning, src: "https://recreater.com/m/faq?cat=18"}
  works_note: {text: "Frederick County RFP 25-320 (proposals due 2026-04-13) to rebuild the Pinecliff boat ramp: new ramp, kayak launch, retaining wall, accessible route. The listing gives no closure dates; construction may affect access now.", tag: documented, src: "https://www.nationgraph.com/rfps/rfp-8f948054-25-320-cp-pinecliff-boat-ramp-rehabilita"}
jurisdiction:
  water: nontidal
  state: MD
  license: "Maryland nontidal license (Matt's stated license; not verified here)"
  flags:
    - "MD DNR: bass catch-and-release applies from Buckeystown Dam down to the Potomac (downstream of this spot; check current regs)."
    - "Frederick County park rules; fishing on the Monocacy follows DNR rules (county FAQ)."
  tag: documented
  src: "https://dnr.maryland.gov/fisheries/Pages/hotspots/monocacy.aspx"
crowding: "Crowded per Matt (firsthand). Busy multi-use county park with sports fields and lodge (riverexplorer)."
hazards:
  - "Flooding: FDKM2 (Jug Bridge, 2.5 mi upstream) action 13 ft, flood 15 ft (documented)."
  - "Ramp construction under a 2026 county contract (documented RFP; status not verified)."
  - "Shallow, rocky river; slippery rock if wading (reasoning)."
matt_notes:
  - {text: "Pinecliff has been crowded.", src: Matt}
