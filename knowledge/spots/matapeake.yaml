id: matapeake
name: Matapeake Fishing Pier (Matapeake Landing, Kent Island)
status: active
lat: 38.9563
lon: -76.3555
approx: true
region: middle-bay
water_type: pier
bank_faces_deg: 270
bank_faces_note: "Pier runs out from Kent Island's west shore into the open Bay; angler faces roughly west toward the Western Shore. Reasoning from map position, not a survey."
bank_faces_tag: reasoning
luca_ok: true
luca_note: "County lists restrooms and a lit pier, and a 2025 Proptalk article calls it a family fishing/crabbing spot. Railing height and pier deck height not found, so watch him closely at the rail. No pets allowed."
luca_tag: reasoning
