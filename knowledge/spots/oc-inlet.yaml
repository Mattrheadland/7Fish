species:
  striped-bass:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "DNR: 'At the inlet and Route 50 Bridge area, anglers are catching striped bass and bluefish' and 'A large percentage of the striped bass are falling short of the 28-inch minimum.'", date: "week before 2026-07-29", published: "2026-07-29", tag: documented, src: "https://news.maryland.gov/dnr/2026/07/29/maryland-fishing-report-july-29-2/"}
      - {text: "DNR: Route 50 Bridge area, striped bass and bluefish on soft plastic jigs and bucktails (shore or boat not stated).", date: "week before 2026-10-07", published: "2026-10-07", tag: documented, src: "https://news.maryland.gov/dnr/2026/10/07/maryland-fishing-report-october-7-2/"}
      - {text: "FishTalk: tip of the north jetty, striped bass and bluefish on bucktails and lures.", date: "not found", published: "not found (context suggests fall 2018)", tag: documented, src: "https://fishtalkmag.com/blog/fishing-ocean-city-inlet"}
    note: "Present, but the July 2026 report says most are under the 28 in minimum. Keepers are not verified."
  bluefish:
    presence: verified
    quality: not_verified
    evidence:
      - {text: "Caught at the inlet and Route 50 bridge (DNR, 2026-07-29 and 2026-10-07); surf bluefish on cut mullet or menhaden (2026-10-07).", date: "weeks before 2026-07-29 and 2026-10-07", published: "2026-10-07", tag: documented, src: "https://news.maryland.gov/dnr/2026/10/07/maryland-fishing-report-october-7-2/"}
  white-perch: {presence: not_verified, quality: not_verified, evidence: [], note: "n/a for a high-salinity ocean inlet; not found"}
  blue-catfish: {presence: not_verified, quality: not_verified, evidence: [], note: "n/a; not found"}
  channel-catfish: {presence: not_verified, quality: not_verified, evidence: [], note: "n/a; not found"}
  other:
    - {species: "sheepshead, tautog", presence: verified, quality: not_verified, text: "DNR: sheepshead and tautog biting at the inlet on sand fleas or green crab (shore).", date: "week before 2026-10-07", published: "2026-10-07", tag: documented, src: "https://news.maryland.gov/dnr/2026/10/07/maryland-fishing-report-october-7-2/"}
    - {species: "flounder, species not confirmed", presence: verified, quality: not_verified, text: "DNR: flounder on the flood tide; East Channel popular. FishTalk: sandy bottom inside the north jetty from shore.", date: "week before 2026-10-07", published: "2026-10-07", tag: documented, src: "https://news.maryland.gov/dnr/2026/10/07/maryland-fishing-report-october-7-2/"}
    - {species: "red drum", presence: not_verified, quality: not_verified, text: "DNR: large red drum caught and released in the OC surf (surf, not the inlet itself).", date: "week before 2026-10-07", published: "2026-10-07", tag: documented, src: "https://news.maryland.gov/dnr/2026/10/07/maryland-fishing-report-october-7-2/"}
    - {species: "triggerfish", presence: verified, quality: not_verified, text: "DNR: along jetty rocks, bulkheads, bridge piers.", date: "week before 2026-07-29", published: "2026-07-29", tag: documented, src: "https://news.maryland.gov/dnr/2026/07/29/maryland-fishing-report-july-29-2/"}
access:
  status: not_verified
  status_note: "Shore fishing on the north jetty is documented (FishTalk, undated), and so is fishing from the Route 50 bridge (oceancity.com). No Town of Ocean City page stating inlet, jetty, bulkhead or bridge fishing rules or hours was found, so hours and after-dark access are not verified."
  parking:
    text: "Hugh T. Cropper Inlet Parking Lot, 809 S. Atlantic Ave, 1,200 spaces. Paid season Apr 1 to Oct 31: in October, free Mon to Thu and $3.50/hr Fri to Sun (per the 2026 page; the October rate is labeled 2025 in one place). Pay-by-plate kiosk or ParkMobile; 30 min free. Lot hours and overnight rules not stated."
    tag: documented
    src: "https://www.oceancity.com/guides/parking"
  walk:
    text: "From the Inlet lot to the inlet bulkhead and north jetty is a short walk at the south end of the boardwalk. Distance not measured."
    tag: reasoning
  stand:
    text: "North jetty, 'from the tip all the way back to where it ends in the bay' (FishTalk). The south jetty is boat-only, on Assateague. Route 50 bridge: fish the pilings from the bridge (oceancity.com). Oceanic Pier is nearby: a paid private pier with a blanket license, 24 hours in season (FishTalk, undated; per Town page, 'Oceanic Pier and Ocean Pier' operate under a Blanket Pier License)."
    tag: documented
    src: "https://fishtalkmag.com/blog/fishing-ocean-city-inlet"
    src2: "https://www.oceancity.com/fishing-in-ocean-city-maryland/"
    src3: "https://oceancitymd.gov/oc/?p=12516"
  casting:
    text: "The inlet channel is open. Strong current sweeps lines, so heavier bucktails or jigs are needed to hold bottom; the outgoing tide is strongest. Expect other anglers along the bulkhead in season."
    tag: reasoning
  landing:
    text: "Route 50 bridge: a bridge net is required per oceancity.com. Jetty: landing on rocks; a long-handled net or drop net is advised. Bulkhead height not found."
    tag: documented
    src: "https://www.oceancity.com/fishing-in-ocean-city-maryland/"
  hours:
    text: "Hours for inlet, jetty, bulkhead and bridge fishing were not found on any Town of Ocean City page. Town beach hours are 5 AM to 12 midnight (beach, not the inlet). Surf fishing on public beaches is banned 10:00 to 17:30 from Memorial Day Friday to Sep 30, and within 50 yards of beachgoers."
    open: "not found"
    close: "not found"
    tag: documented
    src: "https://oceancitymd.gov/oc/?p=3014"
    src2: "https://oceancitymd.gov/oc/?p=12516"
  after_dark: not_verified
  after_dark_note: "Keep the plan in daylight unless Matt confirms on site. Oceanic Pier (private, paid) is reported open 24 hours in season, but that is undated (FishTalk)."
  free_zones:
    text: "Town free fishing zones (no license, free registry required): bulkhead 2nd to 4th St (Chicago Ave) and Northside Park 125th St. Note: the 2nd to 4th St bayside bulkhead is near, but not the same as, the inlet."
    tag: documented
    src: "https://oceancitymd.gov/oc/?p=12516"
jurisdiction:
  water: tidal
  state: MD
  license: "Maryland Chesapeake Bay & Coastal Sport Fishing License, which covers Maryland Atlantic Ocean waters and the coastal bays and their tributaries. Matt states he holds a MD tidal license (not verified); check it is this license."
  flags:
    - "Striped bass follow ATLANTIC/coastal rules, not Bay rules: 28-31 in slot, 1 fish per day, open year-round (DNR 2026 release). COMAR 08.02.15.11 text as displayed showed an older 28-38 / 44+ in, 2-fish rule, so it conflicts. Trust the 2026 DNR release and confirm."
    - "Bluefish 2026: 5 per person per day shore or private boat, 8 in minimum, no closed season."
    - "South jetty and the Assateague side are not shore-accessible from Ocean City."
  tag: documented
  src: "https://dnr.maryland.gov/Pages/service_fishing_license.aspx"
crowding: "Popular inlet next to the boardwalk; expect other anglers in season. Weekday October crowding not found."
hazards:
  - "Slippery jetty rocks; golf shoes with mini-spikes or crampons suggested (FishTalk)"
  - "Strong tidal current in the inlet; outgoing tide with a southern swell is 'downright treacherous' (FishTalk, boat context)"
  - "Boat traffic through the inlet; don't cast at vessels"
  - "Lightning exposure on the jetty"
