id: oc-inlet
name: Ocean City Inlet (MD side — north jetty / inlet bulkhead and Route 50 bridge)
status: active
lat: 38.326
lon: -75.086
approx: true
region: md-coast
water_type: inlet
bank_faces_deg: 180
bank_faces_note: "From the north jetty and inlet bulkhead at the south end of the boardwalk, the angler faces south across the inlet channel. At the Route 50 bridge (about 1.5 mi northwest, approximate) the angler faces the bridge pilings. Reasoning from map position."
bank_faces_tag: reasoning
luca_ok: false
luca_note: "Slippery jetty rocks and strong inlet current. The inlet bulkhead may suit a supervised child better, but no railing or safety details were found. Not a default Luca spot."
luca_tag: reasoning
