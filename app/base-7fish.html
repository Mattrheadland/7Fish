<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>7 Fish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500..900;1,800..900&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: native iOS shell — per-tab navigation stacks, large titles, inset grouped lists, material bars, detent sheets. */
/* Identity: 7 Fish. Matte black like the brand board, seafoam from the mark, the orange ribbon as the one hot accent,
   mint-white type, Montserrat to match the wordmark. One deliberate dark look. */
:root{
  --bg:#0C0E0E; --bg2:#101413; --cell:#151A19; --cell-hi:#222A28; --fill:rgba(160,232,216,.09); --fill2:rgba(160,232,216,.16);
  --label:#E8F6F2; --label2:rgba(213,244,238,.6); --label3:rgba(213,244,238,.3); --sep:rgba(160,232,216,.12);
  --sea:#3DD8C0; --sea-deep:#056D61; --melon:#FB7B4B; --mint:#D5F4EE;
  --tint:var(--sea); --on-tint:#03201C; --tint-soft:rgba(61,216,192,.12);
  --green:#3DD8C0; --gray:#73827F; --thumb:#2A3533;
  --bar:rgba(12,14,14,.82); --bar-line:rgba(160,232,216,.1); --mat:rgba(24,30,29,.86);
  --water:#0A1312; --land:#171D1C; --river:#3DD8C0; --mapline:rgba(160,232,216,.18); --cty:rgba(160,232,216,.05); --town:rgba(213,244,238,.5);
  --fresh:#9AD86A; --salt:#3DD8C0; --pel:#8FA8FF; --cart:#FB7B4B;
  --card:#141918; --card-lock:#0F1312; --sil:#232B2A; --plate:radial-gradient(120% 100% at 50% 30%,#1B2422,#111615);
  --shadow:0 0 0 .5px rgba(160,232,216,.06);
  --navy:#0C0E0E; --navy2:#151A19; --red:#FB7B4B; --sky:#3DD8C0; --gold:#F2C14E;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
  --serif:ui-serif,"New York","Instrument Serif",Georgia,serif;
  --disp:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.2,.85,.25,1); --spring:cubic-bezier(.32,1.25,.4,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{margin:0}
body{color:var(--label);font:17px/1.29 var(--sys);letter-spacing:-.41px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--tint);text-decoration:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
.num{font-family:var(--round);font-variant-numeric:tabular-nums;letter-spacing:0}

/* shell */
.app{position:relative;height:100%;overflow:hidden;transition:transform .5s var(--ease),border-radius .5s var(--ease),filter .5s}
.layer{position:absolute;inset:0;overflow:hidden}
.layer[hidden]{display:none}
.layer.fade{animation:lfade .22s ease-out}
@keyframes lfade{from{opacity:.0}}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);overscroll-behavior-y:contain;touch-action:pan-y;transform:translate3d(0,0,0)}
.page.anim{transition:transform .46s var(--ease)}
.page.enter{transform:translate3d(100%,0,0)}
.page.under{transform:translate3d(-30%,0,0)}
.page.pushed{box-shadow:-12px 0 32px rgba(0,0,0,.14)}
.page::after{content:"";position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .46s var(--ease)}
.page.under::after{opacity:.12}
.page.parked{visibility:hidden}

/* nav bar */
.nav{position:sticky;top:0;z-index:20;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nav::before{content:"";position:absolute;inset:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--bar-line);opacity:0;transition:opacity .2s}
.page.scrolled .nav::before,.nav.solid::before{opacity:1}
.nav>*{position:relative}
.nav-t{font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw;text-align:center}
.page.scrolled .nav-t,.nav.solid .nav-t{opacity:1;transform:none}
.nav-r{justify-self:end;display:flex;gap:6px;align-items:center}
.back{display:flex;align-items:center;gap:2px;color:var(--tint);font-size:17px;padding:6px 6px 6px 2px;max-width:40vw;white-space:nowrap;overflow:hidden}
.back svg{width:13px;height:21px;flex:none;margin-right:4px}
.back:active{opacity:.4}
.cap{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:var(--fill);color:var(--tint);font-size:15px;font-weight:600;letter-spacing:-.24px;transition:background .2s,color .2s,transform .2s}
.cap svg{width:16px;height:16px}
.cap[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.cap:active{transform:scale(.94)}
.lt{padding:3px 20px 10px;max-width:820px;margin:0 auto}
.lt h1{font:700 34px/41px var(--sys);letter-spacing:.37px;margin:0}
.lt p{margin:2px 0 0;color:var(--label2);font-size:15px;letter-spacing:-.24px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* grouped lists */
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 7px;margin-top:26px;font-size:13px;color:var(--label2);letter-spacing:-.08px;text-transform:uppercase}
.gh.big{text-transform:none;font:700 22px/28px var(--sys);letter-spacing:.35px;color:var(--label);padding:0 4px 9px;margin-top:30px}
.gh .act{color:var(--tint);text-transform:none;font-size:15px}
.gf{padding:7px 16px 0;font-size:13px;line-height:1.35;color:var(--label2);letter-spacing:-.08px}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;width:100%;background:var(--cell);transition:background .25s}
.row+.row::before{content:"";position:absolute;top:0;left:var(--inset,16px);right:0;border-top:.5px solid var(--sep)}
button.row:active,a.row:active{background:var(--cell-hi);transition:none}
.row .main{flex:1;min-width:0}
.row .ti{font-size:17px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ti.wrap2{white-space:normal}
.row .su{font-size:15px;line-height:20px;color:var(--label2);letter-spacing:-.24px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .su.wrap2{white-space:normal}
.row .val{color:var(--label2);text-align:right;flex:none;max-width:60%;overflow-wrap:anywhere}
.row .val.nr{color:var(--label3)}
.row .chev{width:8px;height:13px;flex:none;color:var(--label3)}
.row .ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.row .ic svg{width:18px;height:18px}
.cal{width:44px;height:46px;border-radius:10px;background:var(--fill);flex:none;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.cal b{display:block;width:100%;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;color:var(--on-tint);background:var(--tint);padding:1px 0}
.cal span{font:600 21px/29px var(--round)}
.cal.none span{color:var(--label3)}
.out{display:flex;align-items:center;gap:5px;font-size:15px;color:var(--label2);flex:none}
.out svg{width:18px;height:18px}
.out.target{color:var(--tint)}.out.other{color:var(--green)}.out.skunk{color:var(--gray)}
.note{margin:12px 0 0;padding:12px 16px;border-radius:12px;background:var(--tint-soft);color:var(--label);font-size:15px;letter-spacing:-.24px;display:flex;gap:12px;align-items:center}
.note .grow{flex:1}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.tile{background:var(--cell);border-radius:16px;padding:13px 16px 14px;min-width:0;box-shadow:var(--shadow)}
.tile .k{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;letter-spacing:-.24px}
.tile .k svg{width:17px;height:17px}
.tile .v{font:600 34px/40px var(--round);margin-top:10px;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.tile .v small{font:600 17px var(--round);color:var(--label2);margin-left:3px}
.tile .s{font-size:13px;color:var(--label2);margin-top:1px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* segmented + chips */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;height:32px}
.seg .th{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:7px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transform:translateX(calc(100% * var(--i)));transition:transform .32s var(--spring)}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:500;letter-spacing:-.08px;text-align:center;white-space:nowrap;transition:font-weight .1s}
.seg button[aria-pressed="true"]{font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;margin:12px -16px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:16px;background:var(--cell);font-size:15px;letter-spacing:-.24px;box-shadow:var(--shadow);transition:background .2s,color .2s,transform .2s}
.chip:active{transform:scale(.95)}
.chip .d{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--label);color:var(--bg)}
.chip i{font-style:normal;color:var(--label2);font-size:13px}
.chip[aria-pressed="true"] i{color:inherit;opacity:.7}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:0;background:var(--fill);color:var(--label2)}
.tag.tint{background:var(--tint-soft);color:var(--tint)}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:calc(-1 * env(safe-area-inset-bottom,0px));z-index:60;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0 calc(4px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--bar-line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:.1px;color:var(--gray);padding:1px 0 2px}
.tabbar svg{width:28px;height:26px}
.tabbar button[aria-current="page"]{color:var(--tint)}
.tabbar button:active svg{transform:scale(.88)}
.tabbar svg{transition:transform .2s var(--spring)}

/* empty state */
.cu{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 24px 20px;gap:6px}
.cu svg{width:56px;height:56px;color:var(--label3);margin-bottom:10px}
.cu h3{margin:0;font:700 22px/28px var(--sys);letter-spacing:.35px}
.cu p{margin:0;color:var(--label2);font-size:15px;line-height:20px;max-width:34ch}
.say{margin-top:14px;padding:12px 14px;border-radius:14px 14px 14px 4px;background:var(--fill);font-size:15px;line-height:20px;text-align:left;max-width:300px}

/* trip hero */
.hero2{background:var(--cell);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.hero2 .st{display:flex;align-items:center;gap:8px;font-weight:600}
.hero2 .st svg{width:22px;height:22px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}
.trio div{padding:0 12px;border-left:.5px solid var(--sep);min-width:0}
.trio div:first-child{padding-left:0;border-left:0}
.trio b{display:block;font-size:13px;font-weight:400;color:var(--label2);letter-spacing:-.08px}
.trio span{font:600 22px/28px var(--round);font-variant-numeric:tabular-nums}
.quote{font:italic 19px/1.35 var(--serif);margin:0}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;border-radius:12px;overflow:hidden}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block;max-width:100%}
.minimap{height:170px;border-radius:12px;overflow:hidden;background:var(--water);position:relative}
.minimap svg{width:100%;height:100%;display:block}

/* map page */
.page.mapp{overflow:hidden;touch-action:none}
.mapfull{position:absolute;inset:0;background:var(--water);touch-action:none}
.mapfull svg{width:100%;height:100%;display:block}
.land{fill:var(--land)} .cty{fill:none;stroke:var(--cty);stroke-width:.8;vector-effect:non-scaling-stroke}
.bdr{fill:none;stroke:var(--mapline);stroke-width:1;vector-effect:non-scaling-stroke}
.riv{fill:none;stroke:var(--river);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.riv.ap{stroke-dasharray:4 4;stroke-width:1.6;opacity:.8}
.town{fill:var(--town)} .tl{fill:var(--town);font-family:var(--sys);font-weight:500;letter-spacing:0}
.mapfull svg text{letter-spacing:0}
.pl{fill:var(--label);font-family:var(--sys);font-weight:600;paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.pin{cursor:pointer}
.mapctl{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));z-index:10}
.mapctl .seg{background:var(--mat);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 2px 12px rgba(0,0,0,.12)}
.scale{position:absolute;right:16px;top:96px;font-size:11px;font-weight:600;color:var(--label2);z-index:5;display:flex;align-items:center;gap:6px}
.scale i{display:block;height:4px;border:1.5px solid var(--label2);border-top:0}

/* detent sheet */
.ds{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--bar-line),0 -8px 30px rgba(0,0,0,.12);will-change:transform;touch-action:none}
.ds.anim{transition:transform .5s var(--spring)}
.ds-h{padding:6px 16px 10px;cursor:grab;flex:none}
.ds-h::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 10px}
.ds-h h2{margin:0;font:700 22px/28px var(--sys);letter-spacing:.35px}
.ds-h p{margin:2px 0 0;font-size:13px;color:var(--label2)}
.ds-b{flex:1;overflow-y:auto;padding:0 16px calc(90px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--label2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend svg{width:12px;height:12px}
@media (min-width:900px){
  .page.mapp .ds{left:16px;right:auto;top:96px;bottom:auto;height:auto!important;width:340px;max-height:calc(100% - 180px);border-radius:14px;transform:none!important;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  .page.mapp .ds-h::before{display:none}
  .page.mapp .ds-b{padding-bottom:16px}
  .mapctl{left:auto;right:16px;transform:none}
}

/* vault */
.prog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:var(--cell);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-top:8px}
.ringw{width:92px;height:92px;position:relative}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringw .c b{font:600 26px/1 var(--round)}
.ringw .c small{display:block;font-size:11px;color:var(--label2);margin-top:3px}
.pbars{display:grid;gap:8px}
.pbar{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:13px}
.pbar .tr{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.pbar .tr i{display:block;height:100%;border-radius:3px}
.pbar .n{text-align:right;color:var(--label2);font-family:var(--round);font-variant-numeric:tabular-nums}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
@media (max-width:420px){.vgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.vc{--tc:var(--fresh);position:relative;display:flex;flex-direction:column;border-radius:18px;padding:10px 10px 12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;width:100%;aspect-ratio:3/4;transition:transform .35s var(--spring)}
.vc:active{transform:scale(.96)}
.vc.s-salt{--tc:var(--salt)}.vc.s-pelagic{--tc:var(--pel)}.vc.s-rays{--tc:var(--cart)}
.vc .art{position:relative;flex:1;min-height:0;border-radius:12px;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--tc) 20%,transparent),color-mix(in srgb,var(--tc) 6%,transparent) 70%);overflow:hidden}
.vc .art canvas{max-width:92%;max-height:86%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28))}
.vc .no{position:absolute;left:8px;top:7px;font:600 11px var(--round);color:var(--tc);letter-spacing:.2px;font-variant-numeric:tabular-nums}
.vc .nm{font-size:15px;font-weight:600;letter-spacing:-.24px;line-height:19px;margin-top:9px;text-wrap:balance}
.vc .sci{font:italic 13px/17px var(--serif);color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc .bt{position:absolute;right:8px;top:7px}
.vc.locked{background:var(--card-lock);box-shadow:none}
.vc.locked .art{background:var(--fill)}
.vc.locked .art canvas{filter:none;opacity:.9}
.vc.locked .nm{color:var(--label2)}
.vc.caught::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang,0deg),#ffd27a,#ff8fc8,#8fd8ff,#a6ffcb,#ffd27a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.85;pointer-events:none}
.vc.caught .art::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.28) 48%,rgba(255,220,255,.18) 52%,transparent 60%);transform:translateX(-60%);animation:sheen 5.5s ease-in-out infinite;pointer-events:none;mix-blend-mode:soft-light}
@keyframes sheen{0%,55%{transform:translateX(-60%)}85%,100%{transform:translateX(60%)}}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
.vc.caught::before{animation:spinb 9s linear infinite}
@keyframes spinb{to{--ang:360deg}}

/* dex cover */
.cover{position:fixed;inset:0;z-index:100;background:#000;color:#fff;transform:translate3d(0,100%,0);transition:transform .5s var(--ease);overflow:hidden;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);--fill:rgba(120,120,128,.24);--cell:#151A19;--cell-hi:#222A28;--tint:#3DD8C0;--tint-soft:rgba(61,216,192,.12);--on-tint:#03201C;--bar:rgba(12,14,14,.86);--bar-line:rgba(255,255,255,.12);color-scheme:dark}
.cover.on{transform:none}
.cover .stagebox{position:absolute;inset:0;bottom:var(--peek,240px)}
.cover .stagebox canvas{display:block;cursor:grab;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;pointer-events:none}
.hud>*{pointer-events:auto}
.mb{height:32px;min-width:32px;padding:0 12px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(60,60,67,.55);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#fff;font-size:15px;font-weight:600;letter-spacing:-.24px;transition:transform .2s}
.mb:active{transform:scale(.92)}
.mb svg{width:15px;height:15px}
.mb.round{padding:0;width:32px}
.mb.tint{background:var(--tint);color:var(--on-tint)}

/* insights */

/* ---------- heritage brand layer ---------- */
.tabbar button[aria-current]{color:var(--tint)}

/* header band */

/* headings */

/* rows */
.cal{background:var(--cell);border:1px solid var(--sep);border-radius:9px;overflow:hidden}

/* trip verdict */
.result{position:relative;border-radius:18px;overflow:hidden;padding:18px 18px 16px;color:#fff;isolation:isolate}
.result::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;border:2px solid rgba(255,255,255,.18);box-shadow:0 0 0 12px rgba(255,255,255,.05);z-index:-1}
.result.target{background:linear-gradient(150deg,#D5142F,#A50C25)}
.result.other{background:linear-gradient(150deg,var(--navy2),var(--navy))}
.result.skunk,.result.hist{background:var(--cell);color:var(--label);border:1px solid var(--sep)}

.result .trio{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 0;margin-top:16px}
.result.skunk .trio,.result.hist .trio{background:var(--fill)}

.result .trio span{font-family:var(--disp);font-weight:800;font-stretch:80%;font-size:26px}

/* controls */

.sortb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;background:var(--fill);color:var(--tint);font-size:15px;font-weight:600;letter-spacing:-.24px;white-space:nowrap}

/* iOS pull-down menu */
.menu-scrim{position:fixed;inset:0;z-index:200}
.menu{position:fixed;z-index:201;min-width:230px;max-width:min(320px,calc(100vw - 24px));max-height:min(60vh,520px);overflow:auto;border-radius:13px;background:var(--mat);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 .5px var(--bar-line);transform-origin:top right;animation:pop .22s var(--spring)}

.prog{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:none;color:#fff;margin-top:18px}

.dexnav span{font-family:var(--disp);font-weight:800;font-stretch:normal;color:var(--sea)}
.dex-h .tag.tint,.mb.tint{background:var(--sea);color:var(--on-tint)}
.chartcard .big{font-family:var(--disp);font-weight:800;font-stretch:normal}
.mbar .y{background:var(--sea)}
.tile .v{font-family:var(--disp);font-weight:800;letter-spacing:-.5px}
.tabbar button[aria-current]{color:var(--sea)}
.tabbar button[aria-current] svg{filter:drop-shadow(0 0 8px rgba(61,216,192,.55))}

/* show every fish, caught or not */
.vc.locked .art{background:var(--plate)}
.vc.locked .art canvas{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));opacity:1}
.vc.locked .nm{color:var(--label)}

/* ================= living water: ambient layers ================= */
#ambient{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.afish{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.afish .sch{position:absolute;left:0;width:200px;height:60px;transform:scale(var(--sc));animation:swim var(--dur) linear var(--dl) infinite}
.afish span{position:absolute;left:var(--ox);top:calc(50% + var(--oy));width:22px;height:9px;animation:wig 1.1s ease-in-out var(--wd) infinite alternate}
.afish svg{width:100%;height:100%;fill:#0f2724;opacity:.85}
@keyframes swim{from{transform:translateX(-260px) scale(var(--sc))}to{transform:translateX(calc(100vw + 60px)) scale(var(--sc))}}
@keyframes wig{from{transform:translateY(-2px) rotate(-3deg)}to{transform:translateY(2px) rotate(3deg)}}
.afish .sch:nth-child(2){animation-direction:reverse}.afish .sch:nth-child(2) span svg{transform:scaleX(-1)}
.afish svg{transform:scaleX(-1)}.afish .sch:nth-child(2) span svg{transform:none}
.app{z-index:1}
.page{background:transparent}
body::after{content:"";position:fixed;inset:0;z-index:300;pointer-events:none;background:var(--tx-grain);opacity:.035;mix-blend-mode:overlay}
:root{--cell:rgba(21,26,25,.78);--card:rgba(20,25,24,.82);--card-lock:rgba(15,19,18,.8)}
.group{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.group .row{background:transparent}
.tile,.chartcard,.prog{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* hero: transparent so the water shows, with drifting depth contours and rising bubbles */
.hero{background:radial-gradient(90% 120% at 88% 0%,rgba(61,216,192,.12),transparent 60%),linear-gradient(180deg,rgba(8,10,10,.55),rgba(8,10,10,.15))}
.hero::before{opacity:.6}
.hero .contour{position:absolute;inset:-10% -10% 0;background:var(--tx-contour) 0 0/900px 560px repeat;opacity:.16;animation:drift 140s linear infinite;-webkit-mask:linear-gradient(180deg,#000 20%,transparent 92%);mask:linear-gradient(180deg,#000 20%,transparent 92%);pointer-events:none}
@keyframes drift{to{background-position:900px 560px}}
.hero .bubs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hero .bubs i{position:absolute;left:var(--x);bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;border:1px solid rgba(160,240,225,.55);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7) 0 18%,rgba(160,240,225,.08) 40%,transparent 70%);animation:rise var(--d) linear var(--dl) infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(var(--w),-140px)}90%{opacity:.7}100%{transform:translate(calc(var(--w) * -.5),-300px);opacity:0}}
.lockup{position:relative}
.lockup::before{content:"";position:absolute;left:50%;top:70px;width:260px;height:200px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(61,216,192,.22),transparent);animation:breathe 6s ease-in-out infinite;pointer-events:none;z-index:-1}
@keyframes breathe{50%{opacity:.45;transform:translate(-50%,-50%) scale(1.12)}}
/* waterline */
.stripe{position:absolute;left:0;right:0;bottom:-2px;height:40px;overflow:hidden;pointer-events:none}
.stripe svg{position:absolute;left:0;top:0;width:200%;height:100%;display:block}
.stripe .w1{animation:slide 22s linear infinite}
.stripe .w2{animation:slide 15s linear infinite reverse}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* findex cards: fish idle-bob, caught sheen */
.vc .art canvas{animation:bob 6s ease-in-out var(--bd,0s) infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-.6deg)}}
.vc.caught .art::before{content:"";display:block;position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(160,240,225,.14) 48%,transparent 60%);transform:translateX(-100%);animation:sheen2 7s ease-in-out var(--bd,0s) infinite;pointer-events:none}
@keyframes sheen2{0%,60%{transform:translateX(-100%)}90%,100%{transform:translateX(100%)}}
.vc:active{transform:scale(.97)}
/* tab bar: glowing active marker */
.tabbar button{position:relative}
.tabbar button[aria-current]::before{content:"";position:absolute;top:-6px;left:50%;width:26px;height:2px;border-radius:2px;transform:translateX(-50%);background:var(--sea);box-shadow:0 0 12px 2px rgba(61,216,192,.6)}
/* list rows: a soft highlight on press */
button.row:active{background:rgba(61,216,192,.08)}
@media (prefers-reduced-motion:reduce){.hero .contour,.hero .bubs i,.stripe svg,.vc .art canvas,.vc.caught .art::before,.lockup::before{animation:none}.hero .bubs{display:none}}


/* ================= Trip Planner ================= */
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px -20px 0;padding:2px 20px}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;width:54px;height:60px;border-radius:15px;background:rgba(160,232,216,.07);border:1px solid var(--sep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .2s,transform .2s}
.dchip:active{transform:scale(.94)}
.dchip b{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--label2)}
.dchip span{font:800 21px/1.1 var(--disp);color:var(--mint)}
.dchip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);box-shadow:0 8px 22px -10px var(--sea)}
.dchip[aria-pressed="true"] b,.dchip[aria-pressed="true"] span{color:var(--on-tint)}
.moon{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--label2)}
.moon svg{width:26px;height:26px;flex:none}
.moon b{color:var(--label);font-weight:600}
.fav{position:relative;background:var(--cell);border:1px solid var(--sep);border-radius:20px;overflow:hidden;margin-top:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.fav .minimap{height:112px;border-radius:0}
.fav .minimap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(21,26,25,.95));pointer-events:none}
.fav .fh{display:flex;gap:12px;align-items:flex-start;padding:4px 14px 10px;margin-top:-16px;position:relative}
.fav .fh h3{margin:0;font:800 21px/1.08 var(--disp);letter-spacing:-.3px;text-transform:uppercase;color:var(--mint)}
.fav .fh p{margin:4px 0 0;font-size:14px;color:var(--label2)}
.star{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--label3);flex:none;transition:transform .25s var(--spring),color .2s,background .2s}
.star:active{transform:scale(.85)}
.star svg{width:20px;height:20px}
.star.on{color:#F2C14E;background:rgba(242,193,78,.14)}
.cap svg[viewBox="0 0 20 20"]{width:15px;height:15px}
.fav .dist{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px}
.fnote{margin:10px 14px 0;font-size:14px;line-height:19px;color:var(--label2)}
.sunrow,.fstats{display:grid;margin:12px 14px 0;border-radius:13px;background:rgba(160,232,216,.06);padding:9px 0}
.sunrow{grid-template-columns:repeat(4,minmax(0,1fr))}
.fstats{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:8px}
.sunrow div,.fstats div{text-align:center;border-left:1px solid var(--sep);min-width:0;padding:0 4px}
.sunrow div:first-child,.fstats div:first-child{border-left:0}
.sunrow b,.fstats b{display:block;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sunrow span,.fstats span{display:block;font:800 17px/1.3 var(--disp);color:var(--mint);font-variant-numeric:tabular-nums;white-space:nowrap}
.sunrow div:nth-child(2) span,.sunrow div:nth-child(3) span{color:var(--sea)}
.fsp{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px 0}
.fsp .chip{height:28px;padding:0 11px;font-size:13px}
.fav .acts{display:flex;gap:8px;padding:12px 14px 14px}
.fav .acts>*{flex:1;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;background:var(--fill);color:var(--sea);text-decoration:none}
.fav .acts svg{width:16px;height:16px}
.fav .acts .pri{background:var(--sea);color:var(--on-tint)}
.fav .acts>*:active{transform:scale(.97)}
.tabbar button span{white-space:nowrap}
</style>

/* ---------- Ambient water: full-screen shader behind the app (rays, caustics, marine snow, grain) ---------- */
const Ambient = (() => {
  let gl, prog, cv, uR, uT, uS, raf = 0, t0 = performance.now(), last = 0, scroll = 0, scrollT = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const FS = `precision mediump float;
uniform vec2 R;uniform float T;uniform float S;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
float caust(vec2 p,float t){float a=sin(p.x*3.1+t*1.1)+sin(p.y*3.7-t*.9)+sin((p.x+p.y)*2.3+t*.7)+sin((p.x-p.y)*2.9-t*1.3);a=abs(a)*.25;return pow(1.-a,8.);}
void main(){
  vec2 uv=gl_FragCoord.xy/R;vec2 p=(gl_FragCoord.xy-.5*R)/R.y;float y=uv.y;
  vec3 col=mix(vec3(.028,.034,.034),vec3(.024,.10,.092),pow(y,2.4));
  col+=vec3(.0,.035,.03)*fbm(p*1.6+vec2(T*.015,-S*.6));
  float ang=p.x+(1.-y)*.42;float rays=0.;
  for(int i=0;i<3;i++){float fi=float(i);rays+=pow(.5+.5*sin(ang*(7.+fi*3.)+T*(.06+fi*.03)+fi*2.1+fbm(vec2(ang*2.,T*.04+fi))*3.),9.);}
  rays*=smoothstep(.0,1.,y)*.075;
  vec2 cp=p*2.6+vec2(0.,S*.8);
  float c=(caust(cp,T*.5)+.6*caust(cp*1.7+3.1,T*.7))*smoothstep(.5,1.,y)*.05;
  float part=0.;
  for(int L=0;L<3;L++){float fl=float(L);float sc=14.+fl*11.;vec2 q=p*sc+vec2(sin(T*.07+fl)*.6,-T*(.10+.07*fl)+S*(2.+fl*2.));
    vec2 id=floor(q);vec2 f=fract(q)-.5;float r=h(id);vec2 o=vec2(h(id+3.1)-.5,h(id+7.7)-.5)*.7;float d=length(f-o);
    float tw=.6+.4*sin(T*(1.+r*2.)+r*40.);part+=smoothstep(.07*(.35+r),0.,d)*step(.88,r)*(.25+.22*fl)*tw;}
  col+=vec3(.24,.85,.75)*(rays+c)+vec3(.62,.96,.9)*part*.3;
  col*=.82+.18*smoothstep(1.25,.15,length(p*vec2(.9,1.)));
  col+=(h(gl_FragCoord.xy+fract(T)*91.)-.5)*.02;
  gl_FragColor=vec4(col,1.);
}`;
  const VS = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
  function init() {
    cv = document.createElement("canvas"); cv.id = "ambient"; cv.setAttribute("aria-hidden", "true");
    document.body.prepend(cv);
    gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
    if (!gl) { cv.remove(); return; }
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { cv.remove(); gl = null; return; }
    gl.useProgram(prog);
    const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const size = () => { const k = Math.min(1.25, devicePixelRatio || 1) * .75; cv.width = Math.round(innerWidth * k); cv.height = Math.round(innerHeight * k); gl.viewport(0, 0, cv.width, cv.height); draw(performance.now()); };
    addEventListener("resize", size); size();
    document.addEventListener("scroll", e => { const el = e.target; if (el && el.classList && el.classList.contains("page")) scrollT = el.scrollTop / Math.max(1, innerHeight) * .35; }, { capture: true, passive: true });

    if (!gl) return;

})();

          const lastTxt = last ? (() => { const d = pd(last.date); return `${MON[d.getMonth()]} ${d.getDate()}`; })() : "—";
          return `<article class="fav">${favMap(s)}
            <div class="fh"><div style="flex:1;min-width:0"><h3>${esc(s.name)}</h3><p>${esc([s.water, s.region].filter(Boolean).join(" · "))}${s.sample ? " · sample" : ""}</p></div>${favBtn(s)}</div>
            <div class="dist"><span class="tag">${Math.round(mi)} mi</span><span class="tag">~${driveTxt(mi)} drive</span>${pl && pl.up ? `<span class="tag tint">${esc(pl.label)}</span>` : ""}${s.status === "ruled-out" ? `<span class="tag">Ruled out</span>` : ""}</div>
            ${pl && pl.up && pl.note ? `<p class="fnote">${esc(pl.note)}</p>` : ""}
            <div class="sunrow"><div><b>First light</b><span>${tfmt(st.dawn)}</span></div><div><b>Sunrise</b><span>${tfmt(st.rise)}</span></div><div><b>Sunset</b><span>${tfmt(st.set)}</span></div><div><b>Last light</b><span>${tfmt(st.dusk)}</span></div></div>
            <div class="fstats"><div><b>Trips</b><span>${ts.length}</span></div><div><b>Fish</b><span>${fish}</span></div><div><b>Last here</b><span>${lastTxt}</span></div></div>
            ${spp.length ? `<div class="fsp">${spp.map(k => `<button class="chip" data-dex="${k}">${esc(SP[k].n)}</button>`).join("")}</div>` : ""}
            ${a.hours || a.parking ? `<p class="fnote">${esc([a.hours && "Hours: " + a.hours, a.parking && "Parking: " + a.parking].filter(Boolean).join(" · "))}</p>` : ""}
            <div class="acts"><button data-go="spot:${esc(s.id)}">Spot file</button><a class="pri" href="https://maps.apple.com/?daddr=${s.lat},${s.lon}&dirflg=d" target="_blank" rel="noopener">${I.pin}Directions</a></div></article>`;
        };
        const up = srt === "plan" ? favs.filter(r => r.pl && r.pl.up) : [], rest = favs.filter(r => !up.includes(r));
        if (up.length) h += `<div class="gh big">Upcoming</div>${up.map(card).join("")}`;
        if (rest.length) h += `<div class="gh big">${up.length ? "Favorites" : "Your spots"}<span class="act"><button class="sortb" id="pSort">${I.sort}Sort</button></span></div>${rest.map(card).join("")}`;
        else h += `<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="sortb" id="pSort">${I.sort}Sort</button></div>`;
        h += `<div class="gf" style="margin-top:14px">Drive times are rough estimates from Frederick. Sun and moon are worked out on your phone for each spot, so they need no signal.</div>`;
      }
      p.body.innerHTML = h + `</div>`; wireSampleOff(p);
      p.body.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { S.pday = +b.dataset.day; p.render(); });
      p.body.querySelectorAll("button[data-fav]").forEach(b => b.onclick = e => { e.stopPropagation(); toggleFav(b.dataset.fav); });
      const sb = p.body.querySelector("#pSort"); if (sb) sb.onclick = e => menu(e.currentTarget, "Sort favorites by", PSORT, srt, v => { S.psort = v; p.render(); });
    },
  };
}

function boot() {
  Brand.init(); Ambient.init(); ambientFish();
  $("#tabbar").innerHTML = ["log", "plan", "map", "vault", "ins"].map(t => `<button data-t="${t}" ${S.tab === t ? 'aria-current="page"' : ""}>${I[t]}<span>${TABNAME[t]}</span></button>`).join("");
  $("#tabbar").onclick = e => { const b = e.target.closest("button"); if (b) switchTab(b.dataset.t); };
  ["log", "plan", "map", "vault", "ins"].forEach(t => $("#L-" + t).hidden = t !== S.tab);
  push(S.tab, ROOT[S.tab](), false);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !(dex && dex.el.classList.contains("on"))) pop(S.tab); });
}
async function connect() {
  const cl = window.claude;
  if (!cl || !cl.use) { S.live = false; refreshAll(); return; }
  const db = await cl.use("db");
  if (!db) { S.live = false; refreshAll(); return; }
  S.db = db; S.live = true;
  let artSig = "";
  const sub = (col, fn) => db.collection(col).onSnapshot(snap => { fn(snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }))); refreshAll(); }, () => { });
  sub("trips", rows => { S.trips = rows; S.loaded.trips = true; });
  sub("spots", rows => { S.spots = rows; });
  sub("species", rows => { S.art = Object.fromEntries(rows.map(r => [r.id, r])); const sig = JSON.stringify(S.art); if (sig !== artSig) { artSig = sig; if (dex && dex.el.classList.contains("on")) fillDex(); } });
  cl.use("assets").then(a => { S.assets = a; if (dex && dex.el.classList.contains("on")) fillDex(); }).catch(() => { });
}
boot(); connect();

</script>
